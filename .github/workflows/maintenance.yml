name: Monitor and retrain

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/maintenance.yml'
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        type: choice
        options:
          - monitor
          - retrain

permissions:
  contents: read
  id-token: write

concurrency:
  group: clv-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    environment: azure
    timeout-minutes: 30

    env:
      LOGS_WORKSPACE_ID: ${{ vars.LOGS_WORKSPACE_ID }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download versioned data and model
        run: dvc pull

      - name: Monitor live predictions
        if: >-
          ${{ !cancelled() && (github.event.schedule == '0 3 * * *' ||
          inputs.task == 'monitor' || github.event_name == 'push') }}
        run: python -m src.monitor

      - name: Check for retraining
        if: >-
          ${{ !cancelled() && (github.event.schedule == '0 4 1 * *' ||
          inputs.task == 'retrain' || github.event_name == 'push') }}
        run: python -m src.retrain

      - name: Upload reports and candidate records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clv-maintenance-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30