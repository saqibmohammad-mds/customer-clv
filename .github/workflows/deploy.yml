name: Test and deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: clv-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    timeout-minutes: 30

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
      AZURE_REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_SERVER }}
      CLV_API_KEY: ${{ secrets.CLV_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download versioned data and model
        run: dvc pull

      - name: Run tests
        run: python -m pytest -q

      - name: Build and test container
        run: |
          IMAGE="${AZURE_REGISTRY_SERVER}/customer-clv:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          docker run -d --name clv-test \
            -p 127.0.0.1:8000:8000 \
            -e CLV_API_KEY "$IMAGE"
          CLV_BASE_URL=http://127.0.0.1:8000 \
            python -m scripts.smoke_test

      - name: Publish image
        run: |
          az acr login --name "$AZURE_REGISTRY_NAME"
          docker push "$IMAGE"

      - name: Remember previous image
        run: |
          OLD_IMAGE=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv)
          test -n "$OLD_IMAGE"
          echo "OLD_IMAGE=$OLD_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy
        id: deploy
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

      - name: Check deployed API
        id: check
        run: |
          FQDN=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          CLV_BASE_URL="https://$FQDN" \
            python -m scripts.smoke_test

      - name: Restore previous image after deployment failure
        if: >-
          ${{ failure() && env.OLD_IMAGE != '' &&
          (steps.deploy.outcome == 'failure' ||
          steps.check.outcome == 'failure') }}
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$OLD_IMAGE" \
            --output none

      - name: Clean up test container
        if: always()
        run: docker rm -f clv-test || true